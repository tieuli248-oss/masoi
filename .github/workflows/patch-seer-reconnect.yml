name: Patch seer reconnect

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[bot] patch seer reconnect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text(encoding='utf-8')
          marker='''    /*\n     * Phù thủy reconnect.\n     */'''
          block='''    /*\n     * Tiên Tri reconnect trong đêm.\n     * Khôi phục trạng thái đã soi/chưa soi và danh sách mục tiêu hợp lệ.\n     */\n    if (\n        room.phase === "night" &&\n        player.role === "Tiên tri" &&\n        player.alive\n    ) {\n\n        const lastInspection =\n            [...(room.night?.seerInspections || [])]\n                .reverse()\n                .find(\n                    item =>\n                        item.seerId === player.id\n                ) || null;\n\n        const canInspect =\n            player.seerUsedNight !== true &&\n            !room.night?.witchActionOpen;\n\n        socket.emit(\n            "seerState",\n            {\n                used:\n                    player.seerUsedNight === true,\n\n                canInspect,\n\n                targetId:\n                    lastInspection?.targetId || null,\n\n                targetName:\n                    lastInspection?.targetName || null,\n\n                result:\n                    lastInspection?.result || null,\n\n                players:\n                    canInspect\n                        ? alivePlayers()\n                            .filter(\n                                p => p.id !== player.id\n                            )\n                            .map(\n                                p => ({\n                                    id: p.id,\n                                    name: p.name,\n                                    alive: p.alive\n                                })\n                            )\n                        : []\n            }\n        );\n\n    }\n\n\n'''
          if 'socket.emit(\n            "seerState"' not in s:
              if marker not in s:
                  raise SystemExit('Reconnect witch marker not found')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Check server syntax
        run: node --check server.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet || git commit -m "Fix Seer reconnect state"
          git push

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Seer reconnect patch applied and server.js syntax checked.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
