name: Patch wolf night to 45s

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[bot] patch wolf 45s'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change wolf/night timer to 45 seconds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          old = 'const TIME = {\n    night: 50,\n    witchPoison: 45,'
          new = 'const TIME = {\n    night: 45,\n    witchPoison: 45,'
          if old not in s:
              raise SystemExit('Expected TIME config not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Set wolf night timer to 45 seconds" || exit 0
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed --comment "Wolf/night timer changed to 45 seconds and server.js passed node --check."
