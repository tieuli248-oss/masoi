name: Patch sound and realtime day vote

on:
  push:
    paths:
      - '.github/workflows/patch-sound-vote-realtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Patch target not found: {label}')
              s = s.replace(old, new, 1)

          rep(
          '''const TIME = {
              night: 45,
              witchPoison: 45,
              witchSave: 10,
              hunterShoot: 15,
              daySpeech: 180,
              dayVote: 30
          };''',
          '''const TIME = {
              intro: 20,
              night: 45,
              witchPoison: 45,
              witchSave: 10,
              hunterShoot: 15,
              daySpeech: 180,
              dayVote: 30
          };''',
          'TIME intro')

          rep(
          '''const SERVER_AUDIO_LIBRARY = [
              { file: "lobby.mp3", name: "Lobby" },
              { file: "day.mp3", name: "Day" },
              { file: "night.mp3", name: "Night" },
              { file: "dayVote.mp3", name: "dayVote" }
          ];''',
          '''const SERVER_AUDIO_LIBRARY = [
              { file: "lobby.mp3", name: "Lobby" },
              { file: "intro.mp3", name: "Dẫn truyện" },
              { file: "day.mp3", name: "Day" },
              { file: "night.mp3", name: "Night" },
              { file: "dayVote.mp3", name: "dayVote" }
          ];''',
          'audio library intro')

          rep(
          '''    phase: {
                  lobby: "file:lobby.mp3",

                  night: "file:night.mp3",''',
          '''    phase: {
                  lobby: "file:lobby.mp3",
                  intro: "file:intro.mp3",

                  night: "file:night.mp3",''',
          'audio phase intro')

          rep(
          '''        loop:
                      !(
                          key === "daySpeech" ||
                          key === "dayVote"
                      ),''',
          '''        loop:
                      !(
                          key === "intro" ||
                          key === "daySpeech" ||
                          key === "dayVote"
                      ),''',
          'one shot audio')

          rep(
          '''    room.started =
                  true;

              room.gameStartedAt =
                  Date.now();

              room.phase =
                  "lobby";

              room.nightNumber =
                  0;''',
          '''    room.started =
                  true;

              room.gameStartedAt =
                  Date.now();

              room.phase =
                  "intro";

              room.nightNumber =
                  0;''',
          'start game intro phase')

          rep(
          '''    emitRoom();

              sendAdminState();

              startNight();

              return {
                  ok: true
              };''',
          '''    emitRoom();

              sendAdminState();

              emitMusic("intro");

              io.emit(
                  "phaseChanged",
                  {
                      phase: "intro",
                      nightNumber: 0,
                      players: publicPlayers(false)
                  }
              );

              startTimer(
                  TIME.intro,
                  () => {
                      if (room.started && room.phase === "intro") {
                          startNight();
                      }
                  }
              );

              return {
                  ok: true
              };''',
          'start game intro flow')

          marker = '''/* =========================================================
             START DAY VOTE
          ========================================================= */'''
          if marker not in s:
              raise SystemExit('Patch target not found: day vote marker')

          helper = r'''/* =========================================================
             REALTIME DAY VOTE STATE
          ========================================================= */

          function sendDayVoteState(targetSocketId = null) {
              if (room.phase !== "dayVote") return;

              const grouped = new Map();

              for (const [voterId, targetId] of room.dayVotes) {
                  const voter = findPlayer(voterId);
                  const target = findPlayer(targetId);
                  if (!voter?.alive || !target?.alive) continue;

                  if (!grouped.has(target.id)) {
                      grouped.set(target.id, {
                          targetId: target.id,
                          targetName: target.name,
                          voters: []
                      });
                  }

                  grouped.get(target.id).voters.push({
                      id: voter.id,
                      name: voter.name
                  });
              }

              const groups = alivePlayers()
                  .map(p => grouped.get(p.id))
                  .filter(Boolean);

              const payload = { groups };

              if (targetSocketId) {
                  io.to(targetSocketId).emit("dayVoteState", payload);
              } else {
                  io.emit("dayVoteState", payload);
              }
          }


          '''
          s = s.replace(marker, helper + marker, 1)

          rep(
          '''    io.emit(
                  "phaseChanged",
                  {

                      phase:
                          "dayVote",

                      nightNumber:
                          room.nightNumber,

                      players:
                          publicPlayers(false)

                  }
              );

              broadcastPlayers();''',
          '''    io.emit(
                  "phaseChanged",
                  {

                      phase:
                          "dayVote",

                      nightNumber:
                          room.nightNumber,

                      players:
                          publicPlayers(false)

                  }
              );

              sendDayVoteState();

              broadcastPlayers();''',
          'initial realtime vote state')

          rep(
          '''                socket.emit(
                          "dayVoteAccepted",
                          {

                              targetId:
                                  target.id

                          }
                      );

                      addAdminLog(''',
          '''                socket.emit(
                          "dayVoteAccepted",
                          {

                              targetId:
                                  target.id

                          }
                      );

                      sendDayVoteState();

                      addAdminLog(''',
          'realtime vote update')

          rep(
          '''} else if (
              room.phase === "night"
          ) {

              musicKey = "night";

          } else if (
              room.phase === "dayVote"
          ) {''',
          '''} else if (
              room.phase === "intro"
          ) {

              musicKey = "intro";

          } else if (
              room.phase === "night"
          ) {

              musicKey = "night";

          } else if (
              room.phase === "dayVote"
          ) {''',
          'reconnect intro music')

          rep(
          '''    emitMusic(
                  musicKey,
                  socket.id
              );

              sendHistoryToPlayer(''',
          '''    emitMusic(
                  musicKey,
                  socket.id
              );

              if (room.phase === "dayVote") {
                  sendDayVoteState(socket.id);
              }

              sendHistoryToPlayer(''',
          'reconnect day vote state')

          rep(
          '''                if (
                      room.phase === "daySpeech" ||
                      room.phase === "dayVote"
                  ) {''',
          '''                if (
                      room.phase === "daySpeech"
                  ) {''',
          'lock public chat during vote')

          intro_handler = r'''

                  /* =====================================================
                     INTRO FINISHED - HOST CAN ADVANCE EARLY
                  ===================================================== */

                  socket.on(
                      "introFinished",
                      () => {
                          const player = findPlayer(socket.data.playerId);
                          if (
                              !player ||
                              player.id !== room.hostId ||
                              !room.started ||
                              room.phase !== "intro"
                          ) {
                              return;
                          }
                          startNight();
                      }
                  );

          '''
          wolf_marker = '''        /* =====================================================
                     🐺 WOLF VOTE
                  ===================================================== */'''
          if wolf_marker not in s:
              raise SystemExit('Patch target not found: wolf marker')
          s = s.replace(wolf_marker, intro_handler + wolf_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate server
        run: node --check server.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Add intro phase and realtime day voting"
          git push
