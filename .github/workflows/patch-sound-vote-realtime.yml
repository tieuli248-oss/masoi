name: Patch sound and realtime day vote

on:
  push:
    paths:
      - 'scripts/patch_sound_vote_realtime.py'
      - '.github/workflows/patch-sound-vote-realtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_sound_vote_realtime.py
      - run: node --check server.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Add intro phase and realtime day voting" || exit 0
          git push
