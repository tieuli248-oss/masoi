name: Patch night result summary

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[bot] patch night result summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text(encoding='utf-8')

          old='''    const historyWolfTarget = findPlayer(room.night?.wolfTargetId);\n    if (historyWolfTarget) {\n        storeEventHistory(\n            `☀️ ${historyWolfTarget.name} đã bị Sói cắn`,\n            dayRecipients\n        );\n    }'''

          new='''    const actualNightDeaths =\n        Array.isArray(room.pendingNightDeaths)\n            ? room.pendingNightDeaths\n            : [];\n\n    const nightDeathMessage =\n        actualNightDeaths.length === 0\n            ? "🌙 Đêm qua không có người nào chết."\n            : actualNightDeaths.length === 1\n                ? `🌙 ${actualNightDeaths[0].name} đã chết trong đêm qua.`\n                : `🌙 ${actualNightDeaths.map(p => p.name).join(", ")} đã chết trong đêm qua.`;\n\n    storeEventHistory(\n        nightDeathMessage,\n        dayRecipients\n    );'''

          if old not in s:
              raise SystemExit('history wolf target block not found')
          s=s.replace(old,new,1)

          old2='''                wolfBiteMessage:\n                    findPlayer(\n                        room.night?.wolfTargetId\n                    )\n                        ? `${findPlayer(room.night?.wolfTargetId).name} đã bị Sói cắn`\n                        : "Đêm nay Sói không cắn được ai"'''

          new2='''                wolfBiteMessage:\n                    nightDeathMessage'''

          if old2 not in s:
              raise SystemExit('wolfBiteMessage block not found')
          s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Check server syntax
        run: node --check server.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet || git commit -m "Fix morning night-result summary"
          git push

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Morning night-result summary patched and server.js syntax checked.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
