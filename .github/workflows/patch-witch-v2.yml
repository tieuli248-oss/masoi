name: Patch witch v2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[bot] patch witch v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('server.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace('witchPoison: 50,','witchPoison: 45,')

          s=s.replace('''    timerInterval: null,\n\n    night: null,''','''    timerInterval: null,\n\n    witchPoisonTimeout: null,\n\n    night: null,''',1)

          s=s.replace('''        witchPoisonTargetId:\n            null,\n\n        witchActionOpen:\n            false,''','''        witchPoisonTargetId:\n            null,\n\n        witchPoisonDraftTargetId:\n            null,\n\n        witchPoisonWindowOpen:\n            false,\n\n        witchPoisonEndsAt:\n            null,\n\n        witchActionOpen:\n            false,''',1)

          stop_old='''    room.timerEndsAt =\n        null;\n\n}'''
          stop_new='''    room.timerEndsAt =\n        null;\n\n    if (\n        room.witchPoisonTimeout\n    ) {\n        clearTimeout(\n            room.witchPoisonTimeout\n        );\n        room.witchPoisonTimeout =\n            null;\n    }\n\n}'''
          if stop_old in s:
              s=s.replace(stop_old,stop_new,1)

          # Start the 45s poison-selection window in parallel with the normal 50s night timer.
          night_timer='''    startTimer(\n        TIME.night,\n        resolveNight\n    );\n\n}'''
          night_timer_new='''    startTimer(\n        TIME.night,\n        resolveNight\n    );\n\n    startWitchPoisonAction();\n\n}'''
          if night_timer in s and 'startWitchPoisonAction();\n\n}' not in s[s.find(night_timer)-80:s.find(night_timer)+len(night_timer)+80]:
              s=s.replace(night_timer,night_timer_new,1)

          # Replace resolveNight + poison selection window + save phase.
          pattern=r'''/\* =========================================================\n   RESOLVE NIGHT\n========================================================= \*/.*?/\* =========================================================\n   FINISH WITCH ACTION\n========================================================= \*/'''
          replacement='''/* =========================================================\n   RESOLVE NIGHT\n========================================================= */\n\nfunction resolveNight() {\n\n    if (\n        room.phase !== "night" ||\n        !room.night\n    ) {\n        return;\n    }\n\n    /* Khóa mục tiêu độc cuối cùng nếu cửa sổ 45s chưa tự khóa. */\n    lockWitchPoisonSelection();\n\n    room.night.wolfTargetId =\n        calculateWolfTarget()?.id || null;\n\n    const witch = room.players.find(\n        p => p.alive && p.role === "Phù thủy"\n    );\n\n    const target =\n        findPlayer(\n            room.night.wolfTargetId\n        );\n\n    const protectedByGuard =\n        !!target &&\n        room.night.guardTargetId === target.id;\n\n    if (witch?.connected) {\n        let message;\n\n        if (!target) {\n            message =\n                "🐺 Đêm nay Sói không cắn được ai.";\n        } else if (protectedByGuard) {\n            message =\n                `🐺 Sói đã cắn ${target.name}. 🛡️ Người này đã được Bảo Vệ bảo vệ nên bạn không thể dùng bình cứu.`;\n        } else if (witch.used.witchSave) {\n            message =\n                `🐺 Sói đã cắn ${target.name}. ❤️ Bình cứu của bạn đã dùng hết.`;\n        } else {\n            message =\n                `🐺 Sói đã cắn ${target.name}. Bạn có 10 giây để quyết định cứu.`;\n        }\n\n        socketForPlayer(witch)?.emit(\n            "witchWolfResult",\n            {\n                targetId: target?.id || null,\n                targetName: target?.name || null,\n                protectedByGuard,\n                canSave:\n                    !!target &&\n                    !protectedByGuard &&\n                    !witch.used.witchSave,\n                message\n            }\n        );\n    }\n\n    /*\n     * Không có mục tiêu, đã được Bảo Vệ che, Phù Thủy chết/offline,\n     * hoặc bình cứu đã dùng -> không mở lượt cứu.\n     */\n    if (\n        !target ||\n        protectedByGuard ||\n        !witch ||\n        !witch.alive ||\n        witch.used.witchSave\n    ) {\n        finishWitchAction();\n        return;\n    }\n\n    startWitchSaveAction();\n}\n\n\nfunction socketForPlayer(player) {\n    if (!player?.id) return null;\n    return io.sockets.sockets.get(player.id) || null;\n}\n\n\n/* =========================================================\n   WITCH - POISON: FIRST 45s OF NIGHT\n========================================================= */\n\nfunction startWitchPoisonAction() {\n\n    if (room.phase !== "night" || !room.night) return;\n\n    room.night.witchPoisonWindowOpen = true;\n    room.night.witchPoisonEndsAt =\n        Date.now() + TIME.witchPoison * 1000;\n\n    const witch = room.players.find(\n        p => p.alive && p.role === "Phù thủy"\n    );\n\n    if (witch?.connected) {\n        io.to(witch.id).emit(\n            "witchActionRequired",\n            {\n                mode: "poison",\n                message: "☠️ Trong 45 giây đầu của đêm, chọn người để đầu độc. Bạn có thể đổi mục tiêu cho tới khi hết 45 giây.",\n                seconds: TIME.witchPoison,\n                endsAt: room.night.witchPoisonEndsAt,\n                targetId:\n                    room.night.witchPoisonDraftTargetId || null,\n                targetName:\n                    findPlayer(room.night.witchPoisonDraftTargetId)?.name || null,\n                canSave: false,\n                canPoison: !witch.used.witchPoison\n            }\n        );\n    }\n\n    room.witchPoisonTimeout =\n        setTimeout(\n            lockWitchPoisonSelection,\n            TIME.witchPoison * 1000\n        );\n}\n\n\nfunction lockWitchPoisonSelection() {\n\n    if (\n        !room.night ||\n        !room.night.witchPoisonWindowOpen\n    ) {\n        return;\n    }\n\n    room.night.witchPoisonWindowOpen = false;\n    room.night.witchPoisonEndsAt = null;\n\n    if (room.witchPoisonTimeout) {\n        clearTimeout(room.witchPoisonTimeout);\n        room.witchPoisonTimeout = null;\n    }\n\n    const witch = room.players.find(\n        p => p.alive && p.role === "Phù thủy"\n    );\n\n    const target =\n        findPlayer(\n            room.night.witchPoisonDraftTargetId\n        );\n\n    let lockedTarget = null;\n\n    if (\n        witch &&\n        !witch.used.witchPoison &&\n        target &&\n        target.alive\n    ) {\n        witch.used.witchPoison = true;\n        room.night.witchPoisonTargetId = target.id;\n        lockedTarget = target;\n\n        addAdminLog(\n            `Phù thủy ${witch.name} chốt độc ${target.name}.`\n        );\n    }\n\n    if (witch?.connected) {\n        io.to(witch.id).emit(\n            "witchPoisonLocked",\n            {\n                targetId: lockedTarget?.id || null,\n                targetName: lockedTarget?.name || null,\n                used: !!lockedTarget,\n                message: lockedTarget\n                    ? `☠️ Hết 45 giây. Mục tiêu độc cuối cùng: ${lockedTarget.name}.`\n                    : (witch.used.witchPoison\n                        ? "☠️ Bình độc đã được dùng trước đó."\n                        : "☠️ Hết 45 giây. Bạn không chọn ai nên bình độc vẫn còn.")\n            }\n        );\n    }\n}\n\n\n/* =========================================================\n   WITCH - SAVE 10s AFTER WOLF LOCKS AT 50s\n========================================================= */\n\nfunction startWitchSaveAction() {\n\n    if (room.phase !== "night" || !room.night) return;\n\n    const witch = room.players.find(\n        p => p.alive && p.role === "Phù thủy"\n    );\n\n    const target = findPlayer(room.night.wolfTargetId);\n\n    const protectedByGuard =\n        !!target &&\n        room.night.guardTargetId === target.id;\n\n    if (\n        !witch ||\n        !witch.alive ||\n        !target ||\n        protectedByGuard ||\n        witch.used.witchSave\n    ) {\n        finishWitchAction();\n        return;\n    }\n\n    room.night.witchActionOpen = true;\n    room.night.witchActionMode = "save";\n    room.night.witchActionResolved = false;\n\n    emitMusic("witchSave");\n\n    if (witch.connected) {\n        io.to(witch.id).emit(\n            "witchActionRequired",\n            {\n                mode: "save",\n                message: `❤️ ${target.name} đã bị Sói cắn. Bạn có 10 giây để quyết định cứu.`,\n                seconds: TIME.witchSave,\n                targetId: target.id,\n                targetName: target.name,\n                protectedByGuard: false,\n                canSave: !witch.used.witchSave,\n                canPoison: false\n            }\n        );\n    }\n\n    io.emit(\n        "phaseChanged",\n        {\n            phase: "night",\n            nightNumber: room.nightNumber,\n            players: publicPlayers(false),\n            witchAction: true,\n            witchMode: "save"\n        }\n    );\n\n    sendAdminState();\n    startTimer(TIME.witchSave, finishWitchAction);\n}\n\n\n/* =========================================================\n   FINISH WITCH ACTION\n========================================================= */'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'witch phase block replacement count={n}')
          s=s2

          # Replace Witch poison socket handler body section up to Cupid marker.
          pattern2=r'''        /\* =====================================================\n           ☠️ WITCH POISON\n        ===================================================== \*/.*?        /\* =====================================================\n           💘 CUPID'''
          repl2='''        /* =====================================================\n           ☠️ WITCH POISON - DRAFT, CAN CHANGE FOR 45s\n        ===================================================== */\n\n        socket.on(\n            "witchPoison",\n            data => {\n\n                if (\n                    room.phase !== "night" ||\n                    !room.night?.witchPoisonWindowOpen ||\n                    room.night?.witchActionOpen\n                ) {\n                    return;\n                }\n\n                const witch =\n                    findPlayer(\n                        socket.data.playerId\n                    );\n\n                const target =\n                    findPlayer(\n                        data?.targetId\n                    );\n\n                if (\n                    !witch ||\n                    !witch.alive ||\n                    witch.role !== "Phù thủy"\n                ) {\n                    return;\n                }\n\n                if (\n                    witch.used.witchPoison\n                ) {\n                    socket.emit(\n                        "actionError",\n                        {\n                            message:\n                                "Đã dùng bình độc."\n                        }\n                    );\n                    return;\n                }\n\n                if (\n                    !target ||\n                    !target.alive\n                ) {\n                    socket.emit(\n                        "actionError",\n                        {\n                            message:\n                                "Mục tiêu không hợp lệ."\n                        }\n                    );\n                    return;\n                }\n\n                room.night.witchPoisonDraftTargetId =\n                    target.id;\n\n                socket.emit(\n                    "actionAccepted",\n                    {\n                        type:\n                            "witchPoisonDraft",\n\n                        targetId:\n                            target.id,\n\n                        targetName:\n                            target.name\n                    }\n                );\n\n                sendAdminState();\n            }\n        );\n\n\n        /* =====================================================\n           💘 CUPID'''
          s2,n=re.subn(pattern2,repl2,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'witch poison handler replacement count={n}')
          s=s2

          # Reconnect: replace existing witch reconnect block with poison-window + save restoration.
          pattern3=r'''    /\*\n     \* Phù thủy reconnect\.\n     \*/\n\n    if \(.*?\n    \}\n\n    let musicKey ='''
          repl3='''    /*\n     * Phù thủy reconnect.\n     * - 0-45s: khôi phục mục tiêu độc đang tạm chọn.\n     * - Sau 50s nếu đang mở cứu: khôi phục người bị Sói cắn và thời gian còn lại.\n     */\n    if (\n        room.phase === "night" &&\n        player.role === "Phù thủy" &&\n        player.alive\n    ) {\n\n        if (\n            room.night?.witchPoisonWindowOpen\n        ) {\n            const remainingPoison =\n                room.night.witchPoisonEndsAt\n                    ? Math.max(\n                        0,\n                        Math.ceil(\n                            (room.night.witchPoisonEndsAt - Date.now()) / 1000\n                        )\n                    )\n                    : 0;\n\n            socket.emit(\n                "witchActionRequired",\n                {\n                    mode: "poison",\n                    message: `☠️ Còn ${remainingPoison} giây để chọn/đổi mục tiêu độc.`,\n                    seconds: remainingPoison,\n                    endsAt: room.night.witchPoisonEndsAt,\n                    targetId:\n                        room.night.witchPoisonDraftTargetId || null,\n                    targetName:\n                        findPlayer(room.night.witchPoisonDraftTargetId)?.name || null,\n                    canSave: false,\n                    canPoison: !player.used.witchPoison\n                }\n            );\n        } else if (\n            room.night?.witchActionOpen &&\n            room.night?.witchActionMode === "save"\n        ) {\n            const target =\n                findPlayer(\n                    room.night.wolfTargetId\n                );\n\n            const remaining =\n                room.timerEndsAt\n                    ? Math.max(\n                        0,\n                        Math.ceil(\n                            (room.timerEndsAt - Date.now()) / 1000\n                        )\n                    )\n                    : 0;\n\n            socket.emit(\n                "witchActionRequired",\n                {\n                    mode: "save",\n                    message: target\n                        ? `❤️ ${target.name} đã bị Sói cắn. Bạn còn ${remaining} giây để quyết định cứu.`\n                        : "❤️ Không có người bị Sói cắn để cứu.",\n                    seconds: remaining,\n                    targetId: target?.id || null,\n                    targetName: target?.name || null,\n                    canSave: !!target && !player.used.witchSave,\n                    canPoison: false\n                }\n            );\n        } else if (\n            room.night?.witchPoisonTargetId\n        ) {\n            const locked =\n                findPlayer(\n                    room.night.witchPoisonTargetId\n                );\n\n            socket.emit(\n                "witchPoisonLocked",\n                {\n                    targetId: locked?.id || null,\n                    targetName: locked?.name || null,\n                    used: true,\n                    message: locked\n                        ? `☠️ Mục tiêu độc đã khóa: ${locked.name}.`\n                        : "☠️ Mục tiêu độc đã được khóa."\n                }\n            );\n        }\n    }\n\n    let musicKey ='''
          s2,n=re.subn(pattern3,repl3,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'witch reconnect replacement count={n}')
          s=s2

          p.write_text(s,encoding='utf-8')
          PY

      - name: Check server syntax
        run: node --check server.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet || git commit -m "Rework Witch night timing"
          git push

      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Witch v2 patch applied and server.js syntax checked.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
