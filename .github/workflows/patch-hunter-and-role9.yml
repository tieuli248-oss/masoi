name: Patch role 9 and hunter flow

on:
  push:
    paths:
      - 'scripts/patch_hunter_role9.py'
      - '.github/workflows/patch-hunter-and-role9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/patch_hunter_role9.py
      - run: node --check server.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix hunter flow and rebalance 9-player roles" || exit 0
          git push
