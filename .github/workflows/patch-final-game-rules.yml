name: Patch Final Game Rules
on:
  push:
    paths:
      - 'scripts/patch-final-game-rules.py'
      - '.github/workflows/patch-final-game-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: python3 scripts/patch-final-game-rules.py
      - name: Validate server
        run: node --check server.js
      - name: Commit server
        run: |
          if git diff --quiet -- server.js; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Finalize game rules and seer logic"
          git push
